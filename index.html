<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>Обзвон · Красота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
</head>
<body>

<header class="head" id="head">
  <div class="wrap">
    <div class="bar">
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" id="ringFg" cx="24" cy="24" r="20" stroke-dasharray="125.66" stroke-dashoffset="125.66"/></svg>
        <b id="ringPct">0%</b>
      </div>
      <div class="ttl">
        <h1>Обзвон салонов</h1>
        <p id="sub">Загрузка…</p>
      </div>
      <button class="icon-btn" id="exportBtn" title="Скачать результаты (CSV)" aria-label="Скачать результаты">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="Обновить из таблицы" aria-label="Обновить">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/></svg>
      </button>
    </div>

    <label class="search" id="searchBox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Название, адрес, телефон…" autocomplete="off" enterkeyhint="search">
      <button class="x" id="clearQ" type="button" aria-label="Очистить"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <button class="mic" id="mic" type="button" aria-label="Голосовой поиск"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </label>

    <nav class="chips" id="chips">
      <button class="chip on" data-f="left">Осталось <i id="n-left">0</i></button>
      <button class="chip" data-f="callback"><span class="dot" style="background:var(--amber)"></span>Перезвонить <i id="n-callback">0</i></button>
      <button class="chip" data-f="noanswer"><span class="dot" style="background:var(--blue)"></span>Не взяли <i id="n-noanswer">0</i></button>
      <button class="chip" data-f="interest"><span class="dot" style="background:var(--call)"></span>Интерес <i id="n-interest">0</i></button>
      <button class="chip" data-f="refused"><span class="dot" style="background:var(--red)"></span>Отказ <i id="n-refused">0</i></button>
      <button class="chip" data-f="nophone">Без номера <i id="n-nophone">0</i></button>
      <button class="chip" data-f="all">Все <i id="n-all">0</i></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="err" id="err"></div>
  <div class="list" id="list">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>

<button class="fab" id="fab" hidden>
  <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
  <span id="fabTxt">Следующий</span>
</button>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet">
  <div class="sheet-backdrop" data-a="sheet-close"></div>
  <div class="sheet-body">
    <div class="sheet-title" id="sheetTitle">Выберите номер</div>
    <div class="sheet-list" id="sheetList"></div>
    <button class="sheet-cancel" data-a="sheet-close">Отмена</button>
  </div>
</div>
<script src="contacts.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/sync.js"></script>
<script src="js/api.js"></script>
<script src="js/messages.js"></script>
<script src="js/render.js"></script>
<script src="js/actions.js"></script>
<script src="js/ui.js"></script>
<script src="js/export.js"></script>
<script src="js/voice.js"></script>
<script src="js/main.js"></script>
</body>
</html>
