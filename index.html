<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Обзвон · Красота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3f0; --surface:#ffffff; --surface-2:#f0ede9; --line:#e6e1db;
  --text:#1b1820; --muted:#7a7380; --soft:#a49dab;
  --accent:#b4426b; --accent-2:#d9668f; --accent-soft:#f8e6ed;
  --call:#1f9d62; --call-d:#178150; --call-soft:#e3f4ea;
  --amber:#c27a12; --amber-soft:#fbf0dc;
  --red:#c8433c; --red-soft:#fae5e3;
  --blue:#3c6fd1; --blue-soft:#e4ecfb;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(30,20,30,.05),0 6px 20px rgba(30,20,30,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141218; --surface:#1e1b23; --surface-2:#28242e; --line:#332e39;
  --text:#f2eef5; --muted:#a39cab; --soft:#6f6878;
  --accent:#e57aa0; --accent-2:#f093b5; --accent-soft:#3a2230;
  --call:#2fbf7c; --call-d:#25a66a; --call-soft:#173327;
  --amber:#e8a646; --amber-soft:#3a2d17; --red:#ec6b63; --red-soft:#3b1f1e;
  --blue:#7aa2ef; --blue-soft:#1d2a43;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1e1b23; --surface-2:#28242e; --line:#332e39;
  --text:#f2eef5; --muted:#a39cab; --soft:#6f6878;
  --accent:#e57aa0; --accent-2:#f093b5; --accent-soft:#3a2230;
  --call:#2fbf7c; --call-d:#25a66a; --call-soft:#173327;
  --amber:#e8a646; --amber-soft:#3a2d17; --red:#ec6b63; --red-soft:#3b1f1e;
  --blue:#7aa2ef; --blue-soft:#1d2a43;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + var(--safe-b));min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
svg{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
.head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid transparent;transition:border-color .2s}
.head.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.ring{width:48px;height:48px;position:relative;flex-shrink:0}
.ring svg{width:48px;height:48px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.ttl p{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p b{color:var(--text);font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:var(--surface);box-shadow:var(--shadow);color:var(--text);transition:transform .15s}
.icon-btn:active{transform:scale(.94)}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;
  padding:0 6px 0 14px;height:50px;box-shadow:var(--shadow);border:1.5px solid transparent;transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search svg{color:var(--soft)}
.search input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:16px;height:100%}
.search input::placeholder{color:var(--soft)}
.search input::-webkit-search-cancel-button{display:none}
.search .x,.search .mic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.search .x{display:none}
.search.has .x{display:grid}
.search .mic.rec{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none;
  margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;
  white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);min-width:18px;text-align:center}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.on i{color:inherit;opacity:.7}
.dot{width:8px;height:8px;border-radius:50%}

/* ---------- list ---------- */
.err{display:none;margin:4px 0 12px;padding:14px 16px;border-radius:var(--r-sm);background:var(--red-soft);color:var(--red);font-size:14px;font-weight:600}
.err.show{display:block}
.list{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);padding-top:4px}
@media(min-width:760px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;
  display:flex;flex-direction:column;gap:14px;position:relative;
  animation:in .35s cubic-bezier(.2,.8,.2,1) both;transition:opacity .2s, box-shadow .2s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card.ask{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.card.closed{opacity:.62}
.card.closed:hover,.card.closed:focus-within{opacity:1}

.c-top{display:flex;gap:12px;align-items:flex-start;min-width:0}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0;color:#fff}
.c-name{flex:1;min-width:0}
.c-name h3{font-size:16px;font-weight:700;line-height:1.25;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-name p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{flex-shrink:0;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;letter-spacing:.1px;white-space:nowrap}

.phone-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{font-size:22px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.num.none{font-size:15px;font-weight:600;color:var(--muted)}
.alt{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.alt button{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.alt button.sel{background:var(--accent-soft);color:var(--accent)}

.acts{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px 52px;gap:8px}
.btn{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:700;background:var(--surface-2);color:var(--text);transition:transform .12s,background .15s}
.btn:active{transform:scale(.96)}
.btn.call{background:var(--call);color:#fff}
.btn.call:active{background:var(--call-d)}
.btn.call.off{background:var(--surface-2);color:var(--soft);pointer-events:none}
.btn.wa{color:#25a35a}
.btn.ok{background:var(--call-soft);color:var(--call)}
.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}

.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.res button{height:40px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--muted);
  background:transparent;border:1px solid var(--line);transition:all .15s;padding:0 4px;line-height:1.1}
.res button.on[data-s="noanswer"]{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.res button.on[data-s="callback"]{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.res button.on[data-s="interest"]{background:var(--call-soft);color:var(--call);border-color:transparent}
.res button.on[data-s="refused"]{background:var(--red-soft);color:var(--red);border-color:transparent}

.note{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;
  padding:10px 12px;font-size:14px;resize:none;outline:none;min-height:42px;line-height:1.4;transition:border-color .15s}
.note:focus{border-color:var(--accent);background:var(--surface)}
.note::placeholder{color:var(--soft)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--soft);margin-top:-6px}
.meta a{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.meta svg{width:14px;height:14px}
.hint{font-size:13px;color:var(--amber);background:var(--amber-soft);padding:10px 12px;border-radius:12px;line-height:1.4}

.empty{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--soft);margin-bottom:12px}
.skel{height:250px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- next FAB ---------- */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-b));z-index:30;
  height:56px;padding:0 22px 0 18px;border-radius:999px;background:var(--text);color:var(--bg);
  display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;
  box-shadow:0 10px 30px rgba(20,10,20,.28);transition:transform .15s}
.fab:active{transform:translateX(-50%) scale(.96)}
.fab small{font-weight:600;opacity:.6;font-size:13px}
.fab[hidden]{display:none}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,20px);opacity:0;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;
  z-index:40;pointer-events:none;transition:all .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:760px){
  .bar{padding-top:6px}
  .ttl h1{font-size:22px}
  .chips{margin:0;padding-left:0;padding-right:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="head" id="head">
  <div class="wrap">
    <div class="bar">
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" id="ringFg" cx="24" cy="24" r="20" stroke-dasharray="125.66" stroke-dashoffset="125.66"/></svg>
        <b id="ringPct">0%</b>
      </div>
      <div class="ttl">
        <h1>Обзвон салонов</h1>
        <p id="sub">Загрузка…</p>
      </div>
      <button class="icon-btn" id="exportBtn" title="Скачать результаты (CSV)" aria-label="Скачать результаты">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="Обновить из таблицы" aria-label="Обновить">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/></svg>
      </button>
    </div>

    <label class="search" id="searchBox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Название, адрес, телефон…" autocomplete="off" enterkeyhint="search">
      <button class="x" id="clearQ" type="button" aria-label="Очистить"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <button class="mic" id="mic" type="button" aria-label="Голосовой поиск"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </label>

    <nav class="chips" id="chips">
      <button class="chip on" data-f="left">Осталось <i id="n-left">0</i></button>
      <button class="chip" data-f="callback"><span class="dot" style="background:var(--amber)"></span>Перезвонить <i id="n-callback">0</i></button>
      <button class="chip" data-f="noanswer"><span class="dot" style="background:var(--blue)"></span>Не взяли <i id="n-noanswer">0</i></button>
      <button class="chip" data-f="interest"><span class="dot" style="background:var(--call)"></span>Интерес <i id="n-interest">0</i></button>
      <button class="chip" data-f="refused"><span class="dot" style="background:var(--red)"></span>Отказ <i id="n-refused">0</i></button>
      <button class="chip" data-f="nophone">Без номера <i id="n-nophone">0</i></button>
      <button class="chip" data-f="all">Все <i id="n-all">0</i></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="err" id="err"></div>
  <div class="list" id="list">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>

<button class="fab" id="fab" hidden>
  <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
  <span id="fabTxt">Следующий</span>
</button>
<div class="toast" id="toast"></div>

<script src="contacts.js"></script>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbx6mb0WwECF4iO64MAd1HUnB6eyvvqglsO1XB--NoApHZ_MeTo-brVWjjCbUOscz9tOYw/exec';
const LS_KEY='krasota_calls_v2';
const CONTACTS=window.CONTACTS||{};

const STATUS={
  noanswer:{t:'Не взяли',c:'var(--blue)',bg:'var(--blue-soft)'},
  callback:{t:'Перезвонить',c:'var(--amber)',bg:'var(--amber-soft)'},
  interest:{t:'Интерес',c:'var(--call)',bg:'var(--call-soft)'},
  refused:{t:'Отказ',c:'var(--red)',bg:'var(--red-soft)'}
};
const OPEN=new Set(['','noanswer','callback']);   // ещё в работе
const AV=['#b4426b','#7b5cc4','#2f8f83','#c46a3a','#3c6fd1','#9a4fa8','#4f8a3c','#c24b5a'];

const IC={
  phone:'<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>',
  wa:'<svg viewBox="0 0 24 24"><path d="M3 21l1.7-4.6A8.5 8.5 0 1 1 8 19.6Z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-1.8-1-1 .8a4 4 0 0 1-2.3-2.3l.8-1-1-1.8Z" stroke-width="1.5"/></svg>',
  web:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
  ext:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  empty:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'
};

let items=[], state={}, filter='left', query='', pending=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- storage ---------- */
function loadState(){try{state=JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){state={}}}
function saveState(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
const st=id=>state[id]||(state[id]={});

/* ---------- helpers ---------- */
function keyOf(url){
  try{const u=new URL(String(url).trim());return (u.host+u.pathname).replace(/\/+$/,'')}catch(e){return String(url).trim()}
}
function digits(p){let d=String(p).replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length===10)d='7'+d;return d}
function fmt(p){const d=digits(p);return d.length===11?`+7 ${d.slice(1,4)} ${d.slice(4,7)}-${d.slice(7,9)}-${d.slice(9)}`:p}
const isMobile=d=>/^79/.test(d);
function cleanName(n,key){
  n=String(n||'').split(/\s[|–—]\s|\s-\s/)[0].replace(/^"(.*)"$/,'$1').trim();
  return n||key.split('/')[0].replace(/^www\./,'');
}
function initials(n){const w=n.replace(/[^\p{L}\p{N}\s]/gu,'').trim().split(/\s+/);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function pick(row,re){const k=Object.keys(row).find(k=>re.test(k.trim()));return k?String(row[k]??'').trim():''}
function ago(ts){if(!ts)return'';const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return'только что';if(m<60)return m+' мин назад';const h=Math.round(m/60);if(h<24)return h+' ч назад';
  return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800)}

/* ---------- load ---------- */
function loadData(){
  $('refreshBtn').classList.add('spin');$('err').classList.remove('show');
  const cb='jsonp_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
  let done=false;
  const fail=msg=>{if(done)return;done=true;delete window[cb];$('refreshBtn').classList.remove('spin');
    $('err').textContent=msg;$('err').classList.add('show');
    if(!items.length)build(Object.keys(CONTACTS).map(k=>({' сайт':'https://'+k})));};
  const t=setTimeout(()=>fail('Таблица не ответила за 15 секунд — показываю сохранённый список.'),15000);
  window[cb]=data=>{
    if(done)return;done=true;clearTimeout(t);delete window[cb];$('refreshBtn').classList.remove('spin');
    if(!Array.isArray(data)){done=false;return fail(data&&data.error?('Ошибка таблицы: '+data.error):'Неожиданный ответ таблицы.')}
    build(data);toast('Список обновлён');
  };
  const s=document.createElement('script');
  s.src=API_URL+'?callback='+cb+'&t='+Date.now();
  s.onerror=()=>{clearTimeout(t);fail('Не удалось загрузить таблицу — показываю сохранённый список.')};
  document.body.appendChild(s);
}

function build(rows){
  const seen=new Map();
  rows.forEach((row,i)=>{
    const site=pick(row,/^(сайт|site|url)$/i)||pick(row,/сайт|site|url/i);
    if(!site)return;
    const key=keyOf(site);
    if(seen.has(key))return;
    const c=CONTACTS[key]||{};
    const sheetPhone=pick(row,/^телефон|phone/i);
    let phones=[...(c.phones||[])];
    if(sheetPhone&&/\d{6}/.test(sheetPhone)){const d='+'+digits(sheetPhone);if(!phones.includes(d))phones.unshift(d)}
    const name=cleanName(c.name,key);
    const sub=[c.category,c.address].filter(Boolean).join(' · ');
    seen.set(key,{id:key,i,site,name,sub,phones,note:c.note||'',
      sheetResult:pick(row,/результат/i),lpr:pick(row,/лпр/i),
      search:(name+' '+sub+' '+key+' '+phones.map(p=>digits(p)+' '+fmt(p)).join(' ')).toLowerCase()});
  });
  items=[...seen.values()];
  render();
}

/* ---------- render ---------- */
function statusOf(it){return (state[it.id]||{}).s||''}
function passes(it){
  const s=statusOf(it);
  if(filter==='all')return true;
  if(filter==='nophone')return !it.phones.length;
  if(filter==='left')return !s;
  return s===filter;
}
function counts(){
  const n={all:items.length,left:0,callback:0,noanswer:0,interest:0,refused:0,nophone:0};
  items.forEach(it=>{const s=statusOf(it);if(!s)n.left++;else n[s]++;if(!it.phones.length)n.nophone++});
  for(const k in n)$('n-'+k).textContent=n[k];
  const doneN=items.length-n.left;
  const pct=items.length?Math.round(doneN/items.length*100):0;
  $('ringFg').style.strokeDashoffset=125.66*(1-pct/100);
  $('ringPct').textContent=pct+'%';
  const today=items.filter(it=>{const t=(state[it.id]||{}).ts;return t&&new Date(t).toDateString()===new Date().toDateString()}).length;
  $('sub').innerHTML=`<b>${doneN}</b> из ${items.length} · сегодня <b>${today}</b>`;
  return n;
}

function cardHTML(it,idx){
  const s=state[it.id]||{}, status=s.s||'';
  const sel=Math.min(s.p||0,Math.max(it.phones.length-1,0));
  const ph=it.phones[sel], d=ph?digits(ph):'';
  const tag=status?`<span class="tag" style="color:${STATUS[status].c};background:${STATUS[status].bg}">${STATUS[status].t}</span>`:'';
  const color=AV[hash(it.id)%AV.length];
  const alt=it.phones.length>1?`<div class="alt">${it.phones.map((p,j)=>`<button data-a="pick" data-j="${j}" class="${j===sel?'sel':''}">${esc(fmt(p))}</button>`).join('')}</div>`:'';
  const waNum=it.phones.map(digits).find(isMobile);
  return `<article class="card ${status&&!OPEN.has(status)?'closed':''}" data-id="${esc(it.id)}" style="animation-delay:${Math.min(idx,12)*25}ms">
    <div class="c-top">
      <div class="av" style="background:${color}">${esc(initials(it.name))}</div>
      <div class="c-name"><h3>${esc(it.name)}</h3>${it.sub?`<p>${esc(it.sub)}</p>`:''}</div>
      ${tag}
    </div>
    <div class="phone-row">
      ${ph?`<a class="num" href="tel:+${d}" data-a="call">${esc(fmt(ph))}</a>`:`<span class="num none">Номер не найден</span>`}
      ${alt}
    </div>
    ${!ph&&it.note?`<div class="hint">${esc(it.note)} — откройте сайт и запишитесь/напишите там.</div>`:''}
    <div class="acts">
      <a class="btn call ${ph?'':'off'}" href="${ph?'tel:+'+d:'#'}" data-a="call">${IC.phone}${ph?'Позвонить':'Нет номера'}</a>
      <a class="btn wa" href="${waNum?'https://wa.me/'+waNum:'#'}" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp" ${waNum?'':'aria-disabled="true"'}>${IC.wa}</a>
      <a class="btn" href="${esc(it.site)}" target="_blank" rel="noopener" aria-label="Открыть сайт" title="Открыть сайт">${IC.web}</a>
      <button class="btn" data-a="copy" aria-label="Скопировать номер" title="Скопировать номер" ${ph?'':'aria-disabled="true"'}>${IC.copy}</button>
    </div>
    <div class="res">${Object.entries(STATUS).map(([k,v])=>`<button data-a="st" data-s="${k}" class="${status===k?'on':''}">${v.t}</button>`).join('')}</div>
    <textarea class="note" data-a="note" rows="1" placeholder="Заметка: ЛПР, время, что сказали…">${esc(s.n||'')}</textarea>
    <div class="meta">
      <a href="${esc(it.site)}" target="_blank" rel="noopener">${IC.ext}${esc(it.id.replace(/^www\./,''))}</a>
      <span>${s.ts?esc(ago(s.ts)):''}</span>
    </div>
  </article>`;
}

function render(){
  counts();
  const q=query.toLowerCase(), qd=query.replace(/\D/g,'');
  let list=items.filter(it=>passes(it)&&(!q||it.search.includes(q)||(qd.length>=3&&it.search.includes(qd))));
  // с номером — выше; «перезвонить» и «не взяли» — по давности
  list.sort((a,b)=>(!!b.phones.length-!!a.phones.length)||(((state[a.id]||{}).ts||0)-((state[b.id]||{}).ts||0))||a.i-b.i);
  $('list').innerHTML=list.length?list.map(cardHTML).join('')
    :`<div class="empty">${IC.empty}<div>${query?'Ничего не найдено':'Здесь пока пусто'}</div></div>`;
  $('list').querySelectorAll('.note').forEach(autosize);
  const next=nextItem();
  $('fab').hidden=!next;
  if(next)$('fabTxt').innerHTML=`Следующий <small>${esc(next.name.slice(0,22))}</small>`;
}

function nextItem(){return items.filter(it=>it.phones.length&&!statusOf(it)).sort((a,b)=>a.i-b.i)[0]}
function autosize(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}

/* ---------- actions ---------- */
$('list').addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const card=el.closest('.card');const id=card.dataset.id;const it=items.find(x=>x.id===id);const s=st(id);
  const a=el.dataset.a;
  if(a==='call'){if(!it.phones.length){e.preventDefault();return}pending=id;s.ts=s.ts||0}
  if(a==='pick'){s.p=+el.dataset.j;saveState();card.outerHTML=cardHTML(it,0);return}
  if(a==='copy'){const ph=it.phones[s.p||0];if(!ph)return;navigator.clipboard?.writeText(fmt(ph)).then(()=>toast('Номер скопирован'),()=>toast(fmt(ph)));return}
  if(a==='st'){
    const v=el.dataset.s;s.s=s.s===v?'':v;s.ts=Date.now();saveState();
    toast(s.s?STATUS[s.s].t+' ✓':'Статус снят');
    card.classList.remove('ask');
    // карточка уходит из текущего фильтра — плавно
    if(!passes(it)){card.style.transition='opacity .25s,transform .25s';card.style.opacity='0';card.style.transform='scale(.97)';setTimeout(render,230)}
    else render();
  }
});
$('list').addEventListener('input',e=>{if(e.target.dataset.a==='note'){const id=e.target.closest('.card').dataset.id;st(id).n=e.target.value;saveState();autosize(e.target)}});

// после звонка — подсветить карточку, чтобы отметить результат
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&pending){
    const c=document.querySelector(`.card[data-id="${CSS.escape(pending)}"]`);
    if(c){c.classList.add('ask');c.scrollIntoView({behavior:'smooth',block:'center'})}
    pending=null;
  }
});

$('fab').addEventListener('click',()=>{
  const n=nextItem();if(!n)return;
  if(filter!=='left'&&filter!=='all'){setFilter('left')}
  query='';$('q').value='';$('searchBox').classList.remove('has');render();
  const c=document.querySelector(`.card[data-id="${CSS.escape(n.id)}"]`);
  if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.classList.add('ask');setTimeout(()=>c.classList.remove('ask'),2500)}
});

function setFilter(f){filter=f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===f))}
$('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;setFilter(c.dataset.f);render();window.scrollTo({top:0,behavior:'smooth'})});

$('q').addEventListener('input',e=>{query=e.target.value.trim();$('searchBox').classList.toggle('has',!!query);render()});
$('clearQ').addEventListener('click',e=>{e.preventDefault();$('q').value='';query='';$('searchBox').classList.remove('has');render();$('q').focus()});
$('refreshBtn').addEventListener('click',loadData);
addEventListener('scroll',()=>$('head').classList.toggle('scrolled',scrollY>4),{passive:true});

/* ---------- export ---------- */
$('exportBtn').addEventListener('click',()=>{
  const rows=[['Название','Адрес','Телефоны','Сайт','Статус','Заметка','Когда']];
  items.forEach(it=>{const s=state[it.id]||{};rows.push([it.name,it.sub,it.phones.map(fmt).join(', '),it.site,s.s?STATUS[s.s].t:'',s.n||'',s.ts?new Date(s.ts).toLocaleString('ru-RU'):''])});
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='obzvon_'+new Date().toISOString().slice(0,10)+'.csv';a.click();toast('CSV скачан');
});

/* ---------- voice ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=$('mic');
if(SR){const r=new SR();r.lang='ru-RU';
  r.onresult=e=>{const t=e.results[0][0].transcript;$('q').value=t;query=t.trim();$('searchBox').classList.add('has');render()};
  r.onend=r.onerror=()=>mic.classList.remove('rec');
  mic.addEventListener('click',e=>{e.preventDefault();if(mic.classList.contains('rec'))return r.stop();mic.classList.add('rec');r.start()});
}else mic.style.display='none';

loadState();
loadData();
</script>
</body>
