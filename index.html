<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI-обзвон</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --text:#12172b; --muted:#6b7280;
    --primary:#4a6cf7; --primary-d:#3a5bd9; --green:#27ae60; --green-d:#219a52;
    --red:#e74c3c; --border:#e5e7eb; --radius:14px;
    --shadow:0 2px 12px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--text);padding:12px;padding-bottom:90px;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .top h1{font-size:18px;display:flex;align-items:center;gap:8px}
  .top h1 em{font-style:normal;font-size:12px;font-weight:400;color:var(--muted)}
  .refresh{background:var(--primary);color:#fff;border:none;border-radius:10px;
    padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
  .refresh:disabled{background:#aaa}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .stat{background:var(--card);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:20px;line-height:1.1}
  .stat span{font-size:11px;color:var(--muted)}
  .progress{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-bottom:12px}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,#27ae60,#4a6cf7);
    width:0;transition:width .3s}

  /* search */
  .searchbar{display:flex;gap:8px;margin-bottom:10px}
  .searchbar .box{flex:1;position:relative}
  .searchbar input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--border);
    border-radius:12px;font-size:16px;background:var(--card);outline:none;min-height:46px}
  .searchbar input:focus{border-color:var(--primary)}
  .searchbar .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.5}
  .mic{width:46px;height:46px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);font-size:18px;cursor:pointer;flex-shrink:0}
  .mic.rec{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}

  /* filters */
  .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;
    scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--border);
    background:var(--card);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
    min-height:38px;display:flex;align-items:center;gap:6px}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .chip b{font-size:11px;background:rgba(0,0,0,.08);padding:1px 6px;border-radius:10px}
  .chip.active b{background:rgba(255,255,255,.25)}

  /* desktop table */
  .table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;display:none}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead{background:#12172b;color:#fff;position:sticky;top:0;z-index:5}
  th{padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:top}
  tr:hover td{background:#f8f9ff}
  .site{color:var(--primary);text-decoration:none;word-break:break-all;font-size:12px}
  .phone{color:var(--green);font-weight:700;text-decoration:none;white-space:nowrap}
  .row-done td{opacity:.5}
  .row-done .site{text-decoration:line-through}

  /* mobile cards */
  .cards{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px;position:relative;border-left:4px solid var(--primary)}
  .card.no-phone{border-left-color:#f59e0b}
  .card.done{border-left-color:var(--green);opacity:.6}
  .card .badge{position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;
    padding:3px 8px;border-radius:10px;text-transform:uppercase}
  .badge.ok{background:#e8f5e9;color:#2e7d32}
  .badge.warn{background:#fff8e1;color:#b45309}
  .badge.done{background:#e3f2fd;color:#1565c0}
  .card .site-link{display:block;color:var(--primary);text-decoration:none;font-size:13px;
    word-break:break-all;margin-bottom:10px;line-height:1.4;padding-right:60px}
  .card .phone-big{font-size:20px;font-weight:800;color:var(--green);margin-bottom:8px;
    display:flex;align-items:center;gap:8px}
  .card .phone-big.none{font-size:14px;color:var(--muted);font-weight:500}
  .card .ai-hint{background:#f5f7ff;border-radius:10px;padding:10px;font-size:12px;
    color:#3b4a7a;margin-bottom:10px;line-height:1.4;display:flex;gap:8px}
  .card .ai-hint .ico{font-size:16px;flex-shrink:0}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .actions.three{grid-template-columns:1fr 1fr 1fr}
  .btn{border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;
    cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn-call{background:var(--green);color:#fff}
  .btn-call:active{background:var(--green-d)}
  .btn-call:disabled{background:#ddd;color:#888}
  .btn-sec{background:#eef1f8;color:#333}
  .btn-done{background:var(--primary);color:#fff}
  .btn-done:disabled{background:#ddd;color:#888}
  .btn:active{transform:scale(.98)}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .i{font-size:48px;margin-bottom:10px}
  .error{background:#fdecea;color:#c0392b;padding:14px;border-radius:12px;margin-bottom:12px;
    font-size:13px;border-left:4px solid #c0392b;display:none}
  .error.show{display:block}

  /* adaptive */
  @media(min-width:768px){
    body{padding:20px;padding-bottom:20px}
    .top h1{font-size:22px}
    .stats{grid-template-columns:repeat(3,1fr);gap:12px}
    .cards{display:none}
    .table-wrap{display:block}
    .actions{display:flex;gap:6px}
    .btn{min-height:36px;padding:8px 14px;font-size:13px}
  }
  @media(min-width:1024px){
    .searchbar input{font-size:14px;min-height:44px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📞 AI-обзвон <em id="loadInfo">загрузка…</em></h1>
    <button class="refresh" id="refreshBtn" onclick="loadData()">🔄</button>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="stats">
    <div class="stat"><b id="statTotal">0</b><span>всего</span></div>
    <div class="stat"><b id="statCalled" style="color:var(--green)">0</b><span>обзвонено</span></div>
    <div class="stat"><b id="statLeft" style="color:var(--primary)">0</b><span>осталось</span></div>
  </div>
  <div class="progress"><i id="progressBar"></i></div>

  <div class="searchbar">
    <div class="box">
      <span class="ic">🔍</span>
      <input id="search" type="search" placeholder="Поиск: сайт, телефон…" autocomplete="off">
    </div>
    <button class="mic" id="micBtn" title="Голосовой поиск">🎤</button>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-f="all">Все <b id="cAll">0</b></button>
    <button class="chip" data-f="phone">С телефоном <b id="cPhone">0</b></button>
    <button class="chip" data-f="nophone">Без номера <b id="cNoPhone">0</b></button>
    <button class="chip" data-f="done">Обзвонено <b id="cDone">0</b></button>
    <button class="chip" data-f="left">Осталось <b id="cLeft">0</b></button>
  </div>

  <!-- desktop -->
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Сайт</th><th>Телефон</th><th>AI-подсказка</th><th>Действия</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- mobile -->
  <div class="cards" id="cards"></div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbx6mb0WwECF4iO64MAd1HUnB6eyvvqglsO1XB--NoApHZ_MeTo-brVWjjCbUOscz9tOYw/exec';
const LS_KEY='callcenter_ai_v1';

let allData=[];
let state={};          // {rowId: {done, note, result}}
let filter='all';
let query='';

/* ---------- storage ---------- */
function loadState(){try{state=JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){state={}}}
function saveState(){localStorage.setItem(LS_KEY,JSON.stringify(state))}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const norm=k=>String(k).replace(/\s+/g,' ').trim();

function fmtPhone(p){
  let d=String(p).replace(/\D/g,'');
  if(d.length===11&&d[0]==='8')d='7'+d.slice(1);
  if(d.length===11&&d[0]==='7')
    return '+7 ('+d.slice(1,4)+') '+d.slice(4,7)+'-'+d.slice(7,9)+'-'+d.slice(9,11);
  return p;
}

function findPhone(row){
  const direct=Object.keys(row).find(k=>/^телефон$/i.test(k));
  if(direct&&row[direct]&&/\d/.test(row[direct]))return String(row[direct]);
  for(const k of Object.keys(row)){
    if(/тел|phone|номер|моб/i.test(k)&&row[k]&&/\d/.test(row[k]))return String(row[k]);
  }
  // ищем в URL yclid — это не телефон, но если вдруг…
  for(const k of Object.keys(row)){
    const v=String(row[k]||'');
    const m=v.match(/(?:\+7|8|7)[\s\-()]?\d{3}[\s\-()]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}/);
    if(m)return m[0];
  }
  return '';
}

// «AI»: простая эвристика
function aiHint(row,phone){
  const site=Object.entries(row).find(([k])=>/сайт|site|url/i.test(k))?.[1]||'';
  const hints=[];
  if(!phone){
    hints.push('Нет телефона. Проверьте сайт: возможно, номер есть на странице «Контакты».');
  }else{
    hints.push('Номер найден. Уточните ЛПР (администратор/владелец) и удобное время звонка.');
  }
  if(/yclid=/.test(site))hints.push('Ссылка содержит рекламный yclid — источник: Яндекс.Карты (тёплый лид).');
  if(/yandex\.ru\/maps/.test(site))hints.push('Это карточка организации на Яндекс.Картах — сначала откройте её, там обычно есть актуальный телефон.');
  if(/clients\.site/.test(site))hints.push('Сайт-визитка (clients.site) — малый бизнес, решайте быстро.');
  if(/taplink|tilda|dikidi/.test(site))hints.push('Tilda/Taplink/Dikidi — скорее всего, самозанятый мастер, ЛПР = сам мастер.');
  return hints;
}

function rowId(row,phone){
  return phone?'ph_'+phone.replace(/\D/g,''):'h_'+JSON.stringify(row).split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0)|0,0);
}

/* ---------- load ---------- */
function loadData(){
  $('loadInfo').textContent='загрузка…';
  $('refreshBtn').disabled=true;
  $('errorBox').classList.remove('show');

  const old=document.getElementById('jsonpScript'); if(old)old.remove();
  const cb='jsonpCb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
  let done=false;
  const t=setTimeout(()=>{if(done)return;done=true;$('errorBox').textContent='⏱ Таймаут ответа Apps Script.';$('errorBox').classList.add('show');$('refreshBtn').disabled=false;delete window[cb]},15000);

  window[cb]=data=>{
    if(done)return;done=true;clearTimeout(t);delete window[cb];
    const s=document.getElementById('jsonpScript'); if(s)s.remove();

    if(data&&!Array.isArray(data)&&data.error){
      $('errorBox').textContent='❌ '+data.error;$('errorBox').classList.add('show');
      $('loadInfo').textContent='ошибка';$('refreshBtn').disabled=false;return;
    }
    if(!Array.isArray(data)){
      $('errorBox').textContent='❌ Неожиданный формат данных';$('errorBox').classList.add('show');
      $('loadInfo').textContent='ошибка';$('refreshBtn').disabled=false;return;
    }

    allData=data.map(r=>{const o={};Object.keys(r).forEach(k=>o[norm(k)]=r[k]);return o;});
    $('loadInfo').textContent=allData.length+' контактов';
    render();
    $('refreshBtn').disabled=false;
  };

  const script=document.createElement('script');
  script.id='jsonpScript';
  script.src=API_URL+'?callback='+cb+'&t='+Date.now();
  script.onerror=()=>{
    if(done)return;done=true;clearTimeout(t);delete window[cb];
    $('errorBox').textContent='❌ Не удалось загрузить (JSONP).';
    $('errorBox').classList.add('show');$('refreshBtn').disabled=false;
  };
  document.body.appendChild(script);
}

/* ---------- filter logic ---------- */
function passesFilter(item){
  const st=state[item.id]||{};
  if(filter==='done')return !!st.done;
  if(filter==='left')return !st.done;
  if(filter==='phone')return !!item.phone;
  if(filter==='nophone')return !item.phone;
  return true;
}

function matchesQuery(item){
  if(!query)return true;
  const q=query.toLowerCase();
  return (item.site+item.phone+item.raw).toLowerCase().includes(q);
}

/* ---------- render ---------- */
function render(){
  const items=allData.map(row=>{
    const phone=findPhone(row);
    const site=Object.entries(row).find(([k])=>/сайт|site|url/i.test(k))?.[1]||'';
    const id=rowId(row,phone);
    const hints=aiHint(row,phone);
    return {row,phone,site,id,hints,raw:Object.values(row).join(' ')};
  });

  // приоритизация: с телефоном → без; не обзвонено → обзвонено
  items.sort((a,b)=>{
    const ad=state[a.id]?.done?1:0, bd=state[b.id]?.done?1:0;
    if(ad!==bd)return ad-bd;
    if(!!a.phone!==!!b.phone)return a.phone?-1:1;
    return 0;
  });

  const filtered=items.filter(i=>passesFilter(i)&&matchesQuery(i));

  // counters
  const total=items.length;
  const withPhone=items.filter(i=>i.phone).length;
  const doneCount=items.filter(i=>state[i.id]?.done).length;
  $('statTotal').textContent=total;
  $('statCalled').textContent=doneCount;
  $('statLeft').textContent=total-doneCount;
  $('cAll').textContent=total;
  $('cPhone').textContent=withPhone;
  $('cNoPhone').textContent=total-withPhone;
  $('cDone').textContent=doneCount;
  $('cLeft').textContent=total-doneCount;
  $('progressBar').style.width=(total?doneCount/total*100:0)+'%';

  renderTable(filtered);
  renderCards(filtered);
}

function renderTable(items){
  $('tbody').innerHTML=items.map(it=>{
    const st=state[it.id]||{};
    return `<tr class="${st.done?'row-done':''}">
      <td><a class="site" href="${esc(it.site)}" target="_blank" rel="noopener">${esc(it.site)}</a></td>
      <td>${it.phone?`<a class="phone" href="tel:${esc(it.phone.replace(/\D/g,''))}">${esc(fmtPhone(it.phone))}</a>`:'<span style="color:#999">—</span>'}</td>
      <td style="font-size:12px;color:#555;max-width:320px">${esc(it.hints[0]||'')}</td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-done" ${st.done?'disabled':''} onclick="markDone('${esc(it.id)}')">${st.done?'✓':'✓ Обзвонен'}</button>
        </div>
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="4" class="empty"><div class="i">📭</div>Нет данных</td></tr>';
}

function renderCards(items){
  $('cards').innerHTML=items.map(it=>{
    const st=state[it.id]||{};
    const badge=st.done?'<span class="badge done">обзвонен</span>'
      :it.phone?'<span class="badge ok">есть номер</span>'
      :'<span class="badge warn">нужен номер</span>';
    const phoneHtml=it.phone
      ?`<div class="phone-big">📱 ${esc(fmtPhone(it.phone))}</div>`
      :`<div class="phone-big none">📵 Номер не найден</div>`;
    return `<div class="card ${it.phone?'':'no-phone'} ${st.done?'done':''}">
      ${badge}
      <a class="site-link" href="${esc(it.site)}" target="_blank" rel="noopener">${esc(it.site)}</a>
      ${phoneHtml}
      <div class="ai-hint"><span class="ico">🤖</span><span>${esc(it.hints[0]||'')}</span></div>
      <div class="actions">
        ${it.phone
          ?`<a class="btn btn-call" href="tel:${esc(it.phone.replace(/\D/g,''))}">📞 Позвонить</a>`
          :`<button class="btn btn-call" disabled>📵 Нет номера</button>`}
        <button class="btn btn-done" ${st.done?'disabled':''} onclick="markDone('${esc(it.id)}')">${st.done?'✓ Обзвонен':'✓ Отметить'}</button>
      </div>
    </div>`;
  }).join('')||'<div class="empty"><div class="i">📭</div>Ничего не найдено</div>';
}

function markDone(id){
  const st=state[id]||{};
  st.done=!st.done;
  state[id]=st;
  saveState();
  render();
}

/* ---------- search ---------- */
$('search').addEventListener('input',e=>{query=e.target.value.trim();render()});

/* ---------- filters ---------- */
$('filters').addEventListener('click',e=>{
  const btn=e.target.closest('.chip'); if(!btn)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  filter=btn.dataset.f;
  render();
});

/* ---------- voice search ---------- */
const mic=$('micBtn');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const rec=new SR();
  rec.lang='ru-RU'; rec.interimResults=false;
  rec.onresult=e=>{
    const txt=e.results[0][0].transcript;
    $('search').value=txt; query=txt.trim(); render();
  };
  rec.onend=()=>mic.classList.remove('rec');
  rec.onerror=()=>mic.classList.remove('rec');
  mic.addEventListener('click',()=>{
    if(mic.classList.contains('rec')){rec.stop();return}
    mic.classList.add('rec'); rec.start();
  });
}else{
  mic.style.display='none';
}

/* ---------- init ---------- */
loadState();
loadData();
</script>
</body>
</html>
